app-id: com.identicalsoftware.anagramarama
runtime: org.freedesktop.Platform
runtime-version: 25.08
sdk: org.freedesktop.Sdk
command: anagramarama
rename-icon: anagramarama
rename-desktop-file: anagramarama.desktop
rename-appdata-file: anagramarama.metainfo.xml
finish-args:
  - --device=dri
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio

modules:
  - shared-modules/SDL2/SDL2_image.json
  - name: libjansson
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/akheron/jansson.git
        tag: v2.15.0
        commit: 4a9a6db73d5dc553164992e87426502ab2d54512
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: libgamerzilla
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/dulsi/libgamerzilla.git
        tag: release-0.1.3
        commit: 685e4ca066fa2d010d3bf12c4f2755e0cb45a77d
        x-checker-data:
          type: git
          tag-pattern: ^release-([\d.]+)$

  - name: anagramarama
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/dulsi/anagramarama.git
        tag: v0.9
        commit: 47606b7f9e57ec7efae09252709f3eeb136e9003
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
